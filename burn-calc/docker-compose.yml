version: "3.8"

services:
  postgres:
    image: postgres:12
    container_name: burn-calc-db
    environment:
      POSTGRES_USER: andreyroot
      POSTGRES_PASSWORD: andreyroot
      POSTGRES_DB: burn-calc-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: burn-calc-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: andreyroot
      MINIO_SECRET_KEY: andreyroot
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data

  redis:
    image: redis:6.2-alpine
    container_name: burn-calc-redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass password
    volumes:
      - redis-data:/data

volumes:
  postgres_data:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local
